[project]
name = "isekai-core"
version = "0.1.0"
description = "isekai 核心进程：会话核心 + 通道（UMP v1）"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13,<17",
    "httpx>=0.27",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isekai_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
